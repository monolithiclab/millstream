# Drafts a proposal from what gather-evidence found (spec sections 11.3 and 11.6): its kind, its rationale, and the
# whole new content of each file it changes (or a patch in the internal/patch diff format). The engine replaces
# harness and model with improve.harness when it loads the package: claude-code (the claude CLI's login) or api
# (claude-sonnet-5-5, its key in the anthropicKey secret).
name: improve/draft
version: 1.0.0
description: Drafts a lessons, prompt, config or topology proposal from an insight's evidence
kind: agent
input:
  type: object
  properties:
    kind: { enum: [lessons, prompt, config, topology] }
    brief: { type: string }
  required: [kind, brief]
output:
  type: object
  properties:
    kind: { enum: [lessons, prompt, config, topology, none] }
    rationale: { type: string, minLength: 1 }
    insights: { type: array, items: { type: string } }
    files:
      type: array
      items:
        type: object
        properties:
          path: { type: string, minLength: 1 }
          content: { type: string }
        required: [path, content]
        additionalProperties: false
    patch: { type: string }
  required: [kind, rationale]
runtime:
  agent:
    harness: claude-code
    model: sonnet
    network: [api.anthropic.com]
    maxCostUsd: 1
