openapi: 3.1.0
info:
  title: Millstream HTTP API
  version: v1
  description: |
    The HTTP API of Millstream (spec section 12.1). Every record but a pipeline is scoped by its pipeline, so
    resources sit under /pipelines/{pipeline}; the inbox, insights and metrics read across pipelines. JSON keys are
    lowerCamelCase; times are RFC 3339; money is US dollars. Errors are {"error": {"code", "message"}}, with code one
    of notFound, conflict, invalid, unavailable, methodNotAllowed, tooLarge, unauthorized, forbidden,
    unsupportedMediaType and internal. Lists that grow without bound page by an opaque cursor: pass a page's next as
    the cursor of the next request.

    Access. Every POST carries a JSON content type (unsupportedMediaType otherwise), and a request that changes state
    from another origin (its Origin header) is forbidden. Without auth.token the server listens on a loopback address,
    answers only requests naming a loopback host (forbidden otherwise), and records a decision under the
    X-Millstream-User header, else the server's $USER. With auth.token every request carries the token, as
    "Authorization: Bearer <token>" or the session cookie POST /session sets (unauthorized otherwise, signing in and
    out aside); the server also answers ui.baseUrl's host and its listen address's; a request authenticated by the
    cookie that changes state must name its origin; and every decision is recorded under auth.user, whatever the
    request says. A bearer token that is the proposals-only token (POST /proposal-token) reaches only listing,
    reading, creating and revalidating proposals, running backtests, and the reads the improve pipeline gathers
    evidence with (insights, pipelines, revisions and their files, items and their lineage); anything else is
    forbidden, with or without auth.token: the improve package calls the API with it.

    On Postgres a standby engine serves the reads and the UI from a read-only connection: every POST it answers
    503 unavailable, with the active engine's id in the X-Millstream-Active-Engine header and its API address in
    X-Millstream-Active-Address when it knows them. An active engine that lost its write connection, stepping down,
    answers its actions unavailable too.

    Live data is served as server-sent events (text/event-stream) under /live. A run's or an item's stream sends
    "state" events whose id is the event's sequence number; a client resumes after its last id with the
    Last-Event-ID header or the lastEventId query parameter, and receives exactly the events of its scope it
    missed, in order. A cursor that cannot be resumed gets one "snapshotRequired" event and the stream ends: reload
    state through the REST API and subscribe again without a cursor. A pipeline's stream sends "snapshot" events (at
    most four a second, never resumable). The log stream sends "log" events, and a "gap" event first when lines
    were lost since the client's cursor. Every stream sends a comment every 15 seconds while quiet.
servers:
  - url: /api/v1
security: [{}, { bearer: [] }, { session: [] }]
paths:
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This document.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
  /session:
    get:
      operationId: getSession
      summary: Whether the server requires the token, and who the request decides as.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSession
      summary: Sign in with the token, for a session cookie (HttpOnly, SameSite=Strict).
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionLogin" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: Signed in; the response sets the session cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyFailures" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      summary: Sign out; the response clears the session cookie.
      security: [{}]
      responses:
        default: { $ref: "#/components/responses/Error" }
        "204": { description: Signed out. }
  /pipelines:
    get:
      operationId: listPipelines
      summary: Every pipeline with its active revision's graph and its state.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The pipelines, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Pipeline" } }
  /pipelines/{pipeline}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: getPipeline
      summary: A pipeline.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The pipeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/pause:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: pausePipeline
      summary: Pause the pipeline; its deliveries stay pending. A disabled pipeline is resumed first (conflict).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Paused. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/resume:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: resumePipeline
      summary: Resume a paused or disabled pipeline, lifting the pauses a budget made too.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Resumed. }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/disable:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: disablePipeline
      summary: Disable the pipeline; its triggers stop firing and its deliveries wait until it is resumed.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Disabled (or disabled already). }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/rollback:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: rollbackPipeline
      summary: >-
        Reactivate an earlier revision, the one before the active one by default. Runs already started finish on their
        own revision.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The revision now active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/triggers/{trigger}/token:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/trigger" }]
    post:
      operationId: rotateTriggerToken
      summary: >-
        Replace a webhook trigger's token (millstream trigger token --rotate). The new token is answered this once, the
        store keeping only its hash; the old one stops working at once.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The new token, and the trigger's path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerToken" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /hooks/{pipeline}/{trigger}:
    servers: [{ url: / }]
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { $ref: "#/components/parameters/trigger" }
    post:
      operationId: fireWebhook
      summary: >-
        Fire a webhook trigger of the pipeline's active revision with the request's body (spec section 4.6). Served
        outside /api/v1 and outside its access rules: the caller is a service, not a browser, so neither the Host and
        Origin checks nor auth.token and the session cookie apply. The trigger's own token authenticates it, as a
        bearer token or the token query parameter (prefer the header: proxies log URLs). The body is validated
        against the trigger's input schema, up to 1 MiB; a paused pipeline fires (its deliveries wait), a disabled
        one is a conflict. Each trigger takes at most its rate (webhook.rate, 60/min by default).
      security: [{ webhookToken: [] }, { webhookTokenQuery: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            The request id, 1 to 128 printable ASCII characters without spaces: the run's trigger key, so sending
            the request again fires nothing new. Generated when absent.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: Any JSON value the trigger's input schema accepts. }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "202":
          description: The run the request fired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookRun" }
        "200":
          description: The run the request id had already fired; nothing new was fired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429":
          description: >-
            Over the trigger's rate, or ten failed token checks from the caller's address within a minute; Retry-After
            says in how many seconds a request is accepted again.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            A standby engine, or one stepping down: it names the active engine in X-Millstream-Active-Engine and
            X-Millstream-Active-Address when it knows them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /revisions:
    post:
      operationId: applyPackages
      summary: >-
        Apply packages as new revisions (millstream apply). Each package is checked, and so is every other pipeline of
        the deployment; a check error refuses them all (invalid). The body may be up to 64 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The revision of each package, and the check's warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/steps/{step}/pause:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/step" }]
    post:
      operationId: pauseStep
      summary: Pause a step of the active revision.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Paused. }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/steps/{step}/resume:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/step" }]
    post:
      operationId: resumeStep
      summary: Resume a step of the active revision.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Resumed. }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/revisions:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listRevisions
      summary: The pipeline's revisions, newest first.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The revisions, without their graphs.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Revision" } }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/revisions/{revision}:
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { name: revision, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getRevision
      summary: A revision with its graph.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/revisions/{revision}/files:
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { name: revision, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getRevisionFiles
      summary: A revision's package files, for the improve pipeline's drafts (spec section 11.3).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: Each text file's content by path; the files that are not UTF-8 text, by path alone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionFiles" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/streams:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listStreams
      summary: The streams of the active revision, and any other stream holding items, with their item counts.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The streams, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Stream" } }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/runs:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listRuns
      summary: The pipeline's runs, newest first.
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/RunState" } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: A page of runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: triggerRun
      summary: Fire a trigger by hand, recorded as manual.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The run the firing started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "200":
          description: The run the request id had already started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/runs/{run}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/run" }]
    get:
      operationId: getRun
      summary: A run with its item counts per stream and its open dead letters.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/runs/{run}/cancel:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/run" }]
    post:
      operationId: cancelRun
      summary: Cancel a run and discard its open dead letters (spec section 5.3).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/runs/{run}/report:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/run" }]
    get:
      operationId: getRunReport
      summary: A run's report (spec section 11.1).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunReport" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/runs/{run}/deliveries:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/run" }]
    get:
      operationId: listRunDeliveries
      summary: A run's deliveries, in creation order.
      parameters:
        - { name: step, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/DeliveryState" } }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The deliveries.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/replay:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: replay
      summary: Start a replay run of a step over past items (spec section 5.7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The replay run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "200":
          description: The replay run the request id had already started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listItems
      summary: The pipeline's items in insertion order, filtered by stream, run and a CEL expression.
      description: |
        where is a CEL expression over item (the payload), envelope, vars and run, as replay's --where. A page of a
        filtered list reads at most 5000 items: it may come back short with a next cursor.
      parameters:
        - { name: stream, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: where, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: A page of items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items/{item}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/item" }]
    get:
      operationId: getItem
      summary: An item with its payload; one the deployment lacks is looked up in its imported evidence bundles.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items/{item}/lineage:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/item" }]
    get:
      operationId: getLineage
      summary: An item's ancestors and descendants, nearest first.
      parameters:
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The lineage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lineage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items/{item}/deliveries:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/item" }]
    get:
      operationId: listItemDeliveries
      summary: The deliveries of an item, the steps that read it.
      parameters:
        - { name: step, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/DeliveryState" } }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The deliveries.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items/{item}/audits:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/item" }]
    get:
      operationId: listItemAudits
      summary: The fallback audits of the deliveries that read an item (spec section 11.5), oldest first.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The audits.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Audit" } }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/items/{item}/artifacts/{name}:
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { $ref: "#/components/parameters/item" }
      - { $ref: "#/components/parameters/artifactName" }
    get:
      operationId: getItemArtifact
      summary: An artifact of an item, with its media type.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Artifact" }
        "206": { $ref: "#/components/responses/ArtifactRange" }
        "304": { description: Not modified, the client's copy (If-None-Match on the ETag) is current. }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/deliveries/{delivery}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/delivery" }]
    get:
      operationId: getDelivery
      summary: A delivery with its attempts and the artifacts each kept.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/deliveries/{delivery}/attempts/{attempt}/artifacts/{name}:
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { $ref: "#/components/parameters/delivery" }
      - { name: attempt, in: path, required: true, schema: { type: integer } }
      - { $ref: "#/components/parameters/artifactName" }
    get:
      operationId: getAttemptArtifact
      summary: An artifact an attempt kept, such as an agent's transcript.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Artifact" }
        "206": { $ref: "#/components/responses/ArtifactRange" }
        "304": { description: Not modified, the client's copy (If-None-Match on the ETag) is current. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/dead-letters:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listDeadLetters
      summary: Dead letters grouped by step, kind and error fingerprint, largest group first.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, replayed, discarded, all], default: open }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The groups.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeadLetterGroup" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/dead-letters/replay:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: replayDeadLetters
      summary: Replay open dead letters into their runs (spec section 5.6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeadLetterSelection" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: How many were replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Count" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/dead-letters/discard:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: discardDeadLetters
      summary: Discard open dead letters, accepting the loss.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeadLetterSelection" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: How many were discarded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Count" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/lessons:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: listLessons
      summary: The lessons files of the active revision's steps (spec section 11.4).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The steps that have lessons, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StepLessons" } }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/reviews/{delivery}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/delivery" }]
    get:
      operationId: getReview
      summary: The review of a delivery of a review step.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/reviews/{delivery}/decision:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/delivery" }]
    post:
      operationId: decideReview
      summary: Approve, edit then approve, or reject a review (spec section 8).
      parameters: [{ $ref: "#/components/parameters/user" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The review as decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/samples/{delivery}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/delivery" }]
    get:
      operationId: getSample
      summary: The review sample of an auto-approved delivery.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sample" }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/samples/{delivery}/decision:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/delivery" }]
    post:
      operationId: decideSample
      summary: Agree or disagree with the rule that approved a sampled item; it changes nothing else.
      parameters: [{ $ref: "#/components/parameters/user" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleDecision" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The sample as decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sample" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/insights/{insight}/acknowledge:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/insight" }]
    post:
      operationId: acknowledgeInsight
      summary: Acknowledge an insight; the projector keeps updating it and resolves it when it clears.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Acknowledged. }
        "404": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/insights/{insight}/mute:
    parameters: [{ $ref: "#/components/parameters/pipeline" }, { $ref: "#/components/parameters/insight" }]
    post:
      operationId: muteInsight
      summary: Mute an insight; it stays muted whatever the projector finds.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "204": { description: Muted. }
        "404": { $ref: "#/components/responses/Error" }
  /inbox:
    get:
      operationId: listInbox
      summary: Reviews, oldest first; the open ones by default.
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: inbox, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ReviewState" } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: A page of reviews.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "400": { $ref: "#/components/responses/Error" }
  /inbox/samples:
    get:
      operationId: listSamples
      summary: Review samples, oldest first; the open ones by default.
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: inbox, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/SampleState" } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: A page of samples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamplePage" }
        "400": { $ref: "#/components/responses/Error" }
  /insights:
    get:
      operationId: listInsights
      summary: Insights by pipeline, most recently updated first, then the open insights of imported evidence bundles.
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/InsightState" } }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The insights.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Insight" } }
        "400": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      operationId: getMetrics
      summary: A metric's one-minute rollups over a range, one series per group (spec section 10.2).
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: pipeline, in: query, schema: { type: string } }
        - name: groupBy
          in: query
          description: A label to group by (step, action, …); one series of every label set without it.
          schema: { type: string }
        - { $ref: "#/components/parameters/since" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The series, by group.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MetricSeries" } }
        "400": { $ref: "#/components/responses/Error" }
  /metrics/names:
    get:
      operationId: listMetricNames
      summary: The names of the metrics with rollups in a range.
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/since" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The names, sorted.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/evidence:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    post:
      operationId: exportEvidence
      summary: Export an evidence bundle of the pipeline (spec section 11.2).
      description: |
        The bundle is a gzip-compressed tar: a versioned manifest, the open insights (or the one named), a stratified
        sample of the deliveries created within since (improve.evidence.sample) with every step's inputs and outputs on
        their lineages, review decisions without reviewer identities, agent transcripts and the production revision's
        package. Each stream's redact pointers hold a hash keyed per deployment instead of their values. The export is
        recorded under the request's user with the item keys it holds; the bundle expires after improve.evidence.ttl.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceExportRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The bundle, its id in X-Millstream-Bundle.
          headers:
            X-Millstream-Bundle: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /evidence/imports:
    post:
      operationId: importEvidence
      summary: Import an evidence bundle as read-only history, in a development deployment (spec section 11.2).
      description: |
        A production deployment, an expired bundle and a bundle this build cannot read are refused. The bundle is kept
        in the artifact store until it expires, when the engine deletes it; importing it again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceImportRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The bundle, imported by this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceImport" }
        "200":
          description: The bundle, imported already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceImport" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /backtests:
    post:
      operationId: createBacktest
      summary: Start a backtest of a patch against past items, in a development deployment (spec section 11.3).
      description: |
        The patch, a unified diff against the base revision's package, is applied to a scratch copy; the steps it
        changes are replayed on a stratified sample of past deliveries (local history, else imported evidence) in a
        scratch store, once on the base revision and once patched, with every effects external action stubbed. The
        answer comes at once: the backtest runs in the background, its state and report at its Location. A malformed
        or unapplicable request, a production deployment and a spent improve budget are refused at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "202":
          description: The backtest, started.
          headers:
            Location: { schema: { type: string }, description: Where its state is read. }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backtest" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /backtests/{backtest}:
    parameters: [{ name: backtest, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getBacktest
      summary: A backtest's state, and its report once done.
      description: Backtests live in the engine process's memory, the last 100 kept; a restart forgets them.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The backtest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backtest" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /pipelines/{pipeline}/steps/{step}/distill-training:
    parameters:
      - { $ref: "#/components/parameters/pipeline" }
      - { name: step, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDistillTraining
      summary: The training side of an agent step's distill split, in a development deployment (spec section 11.5).
      description: |
        The step's input and output pairs (local history, else the imported evidence; the truth a reviewer's edit
        where there is one, else the agent's output) are split by entity (item key, input item and lineage root)
        and by time: the most recently first-seen entities, half the pairs, are the holdout, which is never served;
        a distill proposal records holdoutFrom, and the engine validates it on the holdout it recomputes from it.
        The step's lessons come without the examples derived from a holdout item. A step that is not an agent step,
        or whose history has nothing to split, is refused.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The training set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistillTraining" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /proposals:
    get:
      operationId: listProposals
      summary: Proposals, newest first (spec section 11.3); a rejected one carries its reason, given to later drafts.
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ProposalState" } }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The proposals.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Proposal" } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProposal
      summary: Create a proposal on the pipeline's active revision and validate it (spec section 11.3).
      description: |
        The patch, a unified diff of the package, is checked against its kind's paths (spec section 11.7): a path its
        kind does not allow, a symbolic link, a file mode change or a path outside the package is invalid. The engine
        then validates it before answering: check on the patched package, the base revision's evals of every affected
        action before and after, and the backtest. The proposal comes back ready when all pass, drafting with its
        report otherwise. A fingerprint a rejection suppresses (until an insight it answers doubles in severity) is a
        conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The proposal, validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proposal-token:
    post:
      operationId: mintProposalToken
      summary: Mint the proposals-only token, replacing the earlier one, and answer it once (spec section 11.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The token; the store keeps only its SHA-256.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                additionalProperties: false
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /proposals/{proposal}:
    parameters: [{ $ref: "#/components/parameters/proposal" }]
    get:
      operationId: getProposal
      summary: A proposal with its patch and its latest validation report.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "404": { $ref: "#/components/responses/Error" }
  /proposals/{proposal}/accept:
    parameters: [{ $ref: "#/components/parameters/proposal" }]
    post:
      operationId: acceptProposal
      summary: Accept a ready proposal on its base revision (spec sections 5.11 and 11.3).
      description: |
        patchSha256 names the patch the decider saw: another is a conflict. The patch is checked against its kind's
        paths again. The acceptance succeeds only while the pipeline's active revision is the proposal's base, and
        makes every other open proposal touching one of its paths or steps stale; when the base moved, the proposal
        becomes stale and the answer is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalDecision" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The proposal, accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proposals/{proposal}/reject:
    parameters: [{ $ref: "#/components/parameters/proposal" }]
    post:
      operationId: rejectProposal
      summary: Reject an open or stale proposal with a reason, required; its fingerprint is suppressed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalDecision" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The proposal, rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proposals/{proposal}/revalidate:
    parameters: [{ $ref: "#/components/parameters/proposal" }]
    post:
      operationId: revalidateProposal
      summary: Validate a proposal again; a stale one is first rebased onto the active revision (a conflict when it does not rebase).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: The proposal, validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proposals/{proposal}/publish:
    parameters: [{ $ref: "#/components/parameters/proposal" }]
    post:
      operationId: publishProposal
      summary: Hand an accepted proposal to the publish action improve.publish names (spec section 11.7), once.
      description: |
        The patch must be the validated one (patchSha256) and pass its kind's path rules again. A proposal published
        already is not published again: the answer says where it went, again true. The proposals-only token may call
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patchSha256]
              additionalProperties: false
              properties:
                patchSha256: { type: string, description: The hash of the patch to publish. }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "200":
          description: Where the proposal went.
          content:
            application/json:
              schema:
                type: object
                required: [proposal, publisher, location, again]
                additionalProperties: false
                properties:
                  proposal: { type: string }
                  publisher: { type: string, description: "apply, patch-file, git-pr-gh or git-pr-glab." }
                  location: { type: string, description: The revision number, the patch file or the pull request URL. }
                  again: { type: boolean, description: Published before; nothing was done this time. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /purges:
    post:
      operationId: createPurge
      summary: Erase the items with a key, or one item, their descendants and their copies in other pipelines (spec section 9.3).
      description: |
        The purge fences the lineage, then runs to its end before the answer: payloads, keys, transcripts and the
        artifacts no surviving item references are deleted. A purge interrupted (a crash, a request cancelled) is
        resumed by the engine. requestId names it: repeating it finds the purge it started. The key or item named is
        not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRequest" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "201":
          description: The purge, started by this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purge" }
        "200":
          description: The purge the request id had already started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purge" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /purges/{purge}:
    parameters: [{ name: purge, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getPurge
      summary: A purge and its progress.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The purge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Purge" }
        "404": { $ref: "#/components/responses/Error" }
  /nodes:
    get:
      operationId: listNodes
      summary: >-
        The engine serving the request, the deployment's engines, the nodes with the leases each holds, and the steps
        whose pending deliveries no node can take.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200":
          description: The engine and its nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nodes" }
  /nodes/{node}/drain:
    parameters: [{ $ref: "#/components/parameters/node" }]
    post:
      operationId: drainNode
      summary: >-
        Drain a remote node: the engine leases it nothing more and it finishes what it holds; it is active again when
        it registers from a new process (spec section 5.10). The embedded node cannot be drained (conflict).
      responses:
        default: { $ref: "#/components/responses/Error" }
        "204": { description: Draining. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /nodes/{node}/revoke:
    parameters: [{ $ref: "#/components/parameters/node" }]
    post:
      operationId: revokeNode
      summary: >-
        Revoke a node id: the engine refuses it from then on and ends the leases it holds at once, each attempt
        consumed as a lease expiry's, so fencing refuses anything it sends afterwards (spec section 15.7). An id never
        registered is recorded revoked.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "204": { description: Revoked. }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /live/pipelines/{pipeline}:
    parameters: [{ $ref: "#/components/parameters/pipeline" }]
    get:
      operationId: livePipeline
      summary: 'Server-sent events: the pipeline''s step snapshots ("snapshot", data PipelineSnapshot).'
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/EventStream" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /live/runs/{run}:
    parameters:
      - { $ref: "#/components/parameters/run" }
      - { $ref: "#/components/parameters/livePipeline" }
      - { $ref: "#/components/parameters/lastEventIdQuery" }
      - { $ref: "#/components/parameters/lastEventIdHeader" }
    get:
      operationId: liveRun
      summary: 'Server-sent events: a run''s state events ("state", data Event, id the sequence number).'
      description: >-
        On subscribing and every heartbeat interval while quiet, the stream sends a "heartbeat" event (data {}) whose
        id is its position, so a client resumes from where the log is; one sent while events are queued has no id.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/EventStream" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /live/items/{item}:
    parameters:
      - { $ref: "#/components/parameters/item" }
      - { $ref: "#/components/parameters/livePipeline" }
      - { $ref: "#/components/parameters/lastEventIdQuery" }
      - { $ref: "#/components/parameters/lastEventIdHeader" }
    get:
      operationId: liveItem
      summary: 'Server-sent events: an item''s state events: its publication and its deliveries'' lifecycle.'
      description: Sends "heartbeat" events carrying its position as their id, as liveRun does.
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/EventStream" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /live/logs:
    get:
      operationId: liveLogs
      summary: 'Server-sent events: the live log tail of the embedded node ("log", data LogLine; "gap").'
      parameters:
        - { name: pipeline, in: query, schema: { type: string } }
        - { name: run, in: query, schema: { type: string } }
        - { name: step, in: query, schema: { type: string } }
        - { name: item, in: query, schema: { type: string } }
        - { name: delivery, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/lastEventIdQuery" }
        - { $ref: "#/components/parameters/lastEventIdHeader" }
      responses:
        default: { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/EventStream" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    pipeline: { name: pipeline, in: path, required: true, schema: { type: string } }
    step: { name: step, in: path, required: true, schema: { type: string } }
    run: { name: run, in: path, required: true, schema: { type: string } }
    item: { name: item, in: path, required: true, schema: { type: string } }
    delivery: { name: delivery, in: path, required: true, schema: { type: string } }
    insight: { name: insight, in: path, required: true, schema: { type: string } }
    proposal: { name: proposal, in: path, required: true, schema: { type: string } }
    node: { name: node, in: path, required: true, schema: { type: string } }
    trigger: { name: trigger, in: path, required: true, schema: { type: string } }
    artifactName: { name: name, in: path, required: true, schema: { type: string } }
    cursor: { name: cursor, in: query, description: A page's next., schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    since:
      name: since
      in: query
      description: The range starts this long ago (10m, 1h, 7d); one hour by default.
      schema: { type: string }
    from: { name: from, in: query, schema: { type: string, format: date-time } }
    to: { name: to, in: query, schema: { type: string, format: date-time } }
    user:
      name: X-Millstream-User
      in: header
      description: Who decides, on a server without auth.token; the server's $USER without it. Ignored with auth.token.
      schema: { type: string }
    livePipeline:
      name: pipeline
      in: query
      required: true
      description: The pipeline of the run or item; their ids are unique within a pipeline only.
      schema: { type: string }
    lastEventIdQuery:
      name: lastEventId
      in: query
      description: The last event id received, to resume; the same as the Last-Event-ID header.
      schema: { type: string }
    lastEventIdHeader: { name: Last-Event-ID, in: header, schema: { type: string } }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The deployment's token (auth.token), on a server that has one.
    session:
      type: apiKey
      in: cookie
      name: millstream_session
      description: The session POST /session starts, for the web UI.
    webhookToken:
      type: http
      scheme: bearer
      description: A webhook trigger's own token, for its /hooks path only.
    webhookTokenQuery:
      type: apiKey
      in: query
      name: token
      description: A webhook trigger's own token as a query parameter, for callers that cannot set a header.
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyFailures:
      description: >-
        Ten failed attempts from the caller's address within a minute (tooManyRequests); Retry-After says in how
        many seconds it is heard again.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Artifact:
      description: The artifact's content, served as its media type under a sandbox policy.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    ArtifactRange:
      description: The byte range of the artifact the Range header asked for.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    EventStream:
      description: A stream of server-sent events.
      content:
        text/event-stream:
          schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [notFound, conflict, invalid, unavailable, methodNotAllowed, tooLarge, unauthorized, forbidden,
                unsupportedMediaType, tooManyRequests, internal]
            message: { type: string }
    RunState: { type: string, enum: [running, waitingReview, succeeded, completedWithErrors, cancelled] }
    DeliveryState:
      type: string
      enum: [pending, leased, done, filtered, awaitingReview, dead, cancelled]
    ReviewState: { type: string, enum: [open, decided, timedOut, cancelled] }
    SampleState: { type: string, enum: [open, decided, unreviewed] }
    InsightState: { type: string, enum: [open, acknowledged, resolved, muted] }
    Pipeline:
      type: object
      required: [name, state, revision, steps, triggers, streams, openDeadLetters, openReviews]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        state: { type: string, enum: [active, paused, disabled] }
        revision: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/Trigger" } }
        imports: { type: array, items: { $ref: "#/components/schemas/Import" } }
        streams: { type: array, items: { type: string } }
        lastRun: { $ref: "#/components/schemas/RunSummary" }
        openDeadLetters: { type: integer }
        openReviews: { type: integer }
    Step:
      type: object
      required: [name, action, builtin, in, out, dlq, concurrency, paused]
      additionalProperties: false
      properties:
        name: { type: string }
        action: { type: string }
        builtin: { type: boolean }
        in: { type: array, items: { type: string } }
        out: { type: array, items: { type: string } }
        dlq: { type: string }
        concurrency: { type: integer }
        paused: { type: boolean }
        pauseCause: { type: string, description: The budget that paused the step (budget.run or budget.day). }
    Trigger:
      type: object
      required: [name, kind, stream]
      additionalProperties: false
      properties:
        name: { type: string }
        kind: { type: string, enum: [cron, manual, webhook, insight] }
        schedule: { type: string }
        stream: { type: string }
        path: { type: string, description: "A webhook trigger's path under the server's address: /hooks/{pipeline}/{trigger}." }
        rate: { type: string, description: "The most requests a webhook trigger's token makes per period, such as 60/min." }
    Import:
      type: object
      description: A stream the revision imports from another pipeline (spec section 4.12).
      required: [name, pipeline, stream]
      additionalProperties: false
      properties:
        name: { type: string, description: The stream's name in the importing revision. }
        pipeline: { type: string, description: The producer pipeline. }
        stream: { type: string, description: The producer's stream. }
    Revision:
      type: object
      required: [id, pipeline, packageHash, appliedAt, active]
      additionalProperties: false
      properties:
        id: { type: integer }
        pipeline: { type: string }
        packageHash: { type: string }
        appliedAt: { type: string, format: date-time }
        message: { type: string, description: Why it was applied (apply --message). }
        active: { type: boolean }
        graph: { $ref: "#/components/schemas/Graph" }
    RevisionFiles:
      type: object
      required: [packageHash, files, binary]
      additionalProperties: false
      properties:
        packageHash: { type: string }
        files: { type: object, additionalProperties: { type: string } }
        binary: { type: array, items: { type: string } }
    Graph:
      type: object
      required: [steps, triggers, streams]
      additionalProperties: false
      properties:
        description: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/Trigger" } }
        imports: { type: array, items: { $ref: "#/components/schemas/Import" } }
        streams: { type: array, items: { type: string } }
    Stream:
      type: object
      required: [name, producers, consumers, items]
      additionalProperties: false
      properties:
        name: { type: string }
        producers: { type: array, items: { type: string } }
        consumers: { type: array, items: { type: string } }
        items: { type: integer }
    RunSummary:
      type: object
      required: [id, state, startedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/RunState" }
        startedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
    Run:
      type: object
      required: [id, pipeline, revision, kind, triggerKey, triggerSource, generation, state, startedAt, costUsd, vars,
        varSources]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        revision: { type: integer }
        kind: { type: string, enum: [trigger, replay, import] }
        trigger: { type: string, description: The trigger, or for an import run the imported stream. }
        triggerKey: { type: string, description: The scheduled time or request id, or for an import run the producer run. }
        triggerSource: { type: string, enum: [cron, manual, webhook, import, insight] }
        scheduledAt: { type: string, format: date-time }
        generation: { type: integer }
        state: { $ref: "#/components/schemas/RunState" }
        startedAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time }
        costUsd: { type: number }
        vars: { type: object }
        varSources: { type: object, additionalProperties: { type: string } }
        items:
          type: object
          description: Items per stream; on one run only.
          additionalProperties: { type: integer }
        openDeadLetters: { type: integer, description: On one run only. }
        producer: { type: string, description: An import run's producer pipeline (spec section 4.12); its triggerKey is the producer run. }
    RunPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next: { type: string }
    RunReport:
      type: object
      required: [pipeline, run, kind, state, startedAt, settledAt, durationSeconds, costUsd, items, criticalPath,
        steps, failures, comparison, eta]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        run: { type: string }
        kind: { type: string }
        state: { $ref: "#/components/schemas/RunState" }
        startedAt: { type: string, format: date-time }
        settledAt: { type: [string, "null"], format: date-time }
        durationSeconds: { type: number }
        costUsd: { type: number }
        items: { type: object, additionalProperties: { type: integer } }
        criticalPath:
          type: object
          required: [totalSeconds, steps]
          additionalProperties: false
          properties:
            totalSeconds: { type: number }
            steps:
              type: [array, "null"]
              items:
                type: object
                required: [step, delivery, latencySeconds, waitSeconds, workSeconds, backoffSeconds, share]
                additionalProperties: false
                properties:
                  step: { type: string }
                  delivery: { type: string }
                  latencySeconds: { type: number }
                  waitSeconds: { type: number }
                  workSeconds: { type: number }
                  backoffSeconds: { type: number }
                  share: { type: number }
        steps:
          type: [array, "null"]
          items:
            type: object
            required: [step, deliveries, failedAttempts, p50Seconds, p95Seconds, maxSeconds, meanWaitSeconds,
              meanWorkSeconds, costUsd]
            additionalProperties: false
            properties:
              step: { type: string }
              deliveries: { type: integer }
              failedAttempts: { type: integer }
              p50Seconds: { type: number }
              p95Seconds: { type: number }
              maxSeconds: { type: number }
              meanWaitSeconds: { type: number }
              meanWorkSeconds: { type: number }
              costUsd: { type: number }
        failures:
          type: [array, "null"]
          items:
            type: object
            required: [step, class, message, example, count, recovered]
            additionalProperties: false
            properties:
              step: { type: string }
              class: { type: string }
              message: { type: string }
              example: { type: string }
              count: { type: integer }
              recovered: { type: integer }
        comparison:
          oneOf:
            - type: "null"
            - type: object
              required: [runs, durationSeconds, costUsd, items, failedAttempts]
              additionalProperties: false
              properties:
                runs: { type: integer }
                durationSeconds: { $ref: "#/components/schemas/Figure" }
                costUsd: { $ref: "#/components/schemas/Figure" }
                items: { $ref: "#/components/schemas/Figure" }
                failedAttempts: { $ref: "#/components/schemas/Figure" }
        eta: { type: [string, "null"], format: date-time }
    Figure:
      type: object
      required: [value, median]
      additionalProperties: false
      properties:
        value: { type: number }
        median: { type: number }
    ArtifactRef:
      type: object
      required: [name, sha256, size, type]
      additionalProperties: false
      properties:
        name: { type: string }
        sha256: { type: string }
        size: { type: integer }
        type: { type: string, description: The media type. }
    Item:
      type: object
      required: [id, pipeline, runId, stream, step, key, parents, generation, ts, payload, artifacts]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        runId: { type: string }
        stream: { type: string }
        step: { type: string }
        key: { type: string }
        parents: { type: array, items: { type: string } }
        generation: { type: integer }
        ts: { type: string, format: date-time }
        payload: {}
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactRef" } }
        parentPipeline:
          type: string
          description: The pipeline of the item's parents when it is another one, for a copy published on an imported stream.
        tombstone: { $ref: "#/components/schemas/Tombstone" }
        producedBy:
          type: string
          enum: [primary, fallback]
          description: For an output of a step with a fallback (spec section 11.5), the action that produced it.
    Audit:
      type: object
      description: >-
        A fallback audit (spec section 11.5): the step's fallback run on an item its primary action covered, a record
        beside the run. primary and fallback are each action's outputs; fallback and agreement are null until done.
      required: [id, pipeline, deliveryId, runId, step, itemId, state, primary, fallback, agreement, costUsd, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        deliveryId: { type: string, description: The delivery its primary action covered. }
        runId: { type: string }
        step: { type: string }
        itemId: { type: string }
        state: { type: string, enum: [pending, leased, done, failed, cancelled] }
        primary:
          oneOf:
            - { type: array, items: { $ref: "#/components/schemas/AuditOutput" } }
            - { type: "null" }
        fallback:
          oneOf:
            - { type: array, items: { $ref: "#/components/schemas/AuditOutput" } }
            - { type: "null" }
        agreement:
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: "null" }
          description: 1 when the fallback's outputs are the primary's, 0 otherwise; null until done.
        costUsd: { type: number }
        error: { type: string, description: Why a failed or cancelled audit ended. }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    AuditOutput:
      type: object
      required: [key, payload]
      additionalProperties: false
      properties:
        key: { type: string }
        payload: {}
    Tombstone:
      type: string
      enum: [expired, erased]
      description: Why the item no longer holds its payload (spec section 9.3); absent while it does. Its payload is then null and it has no artifacts; an erased item has no key either.
    ItemPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        next: { type: string }
    LineageNode:
      type: object
      required: [id, pipeline, runId, stream, step, key, parents, ts]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string, description: The item's pipeline, another one for an item reached through an imported stream. }
        runId: { type: string }
        stream: { type: string }
        step: { type: string }
        key: { type: string }
        parents: { type: array, items: { type: string } }
        ts: { type: string, format: date-time }
        tombstone: { $ref: "#/components/schemas/Tombstone" }
    Lineage:
      type: object
      required: [item, up, down, truncated]
      additionalProperties: false
      properties:
        item: { type: string }
        up: { type: array, items: { $ref: "#/components/schemas/LineageNode" } }
        down: { type: array, items: { $ref: "#/components/schemas/LineageNode" } }
        truncated: { type: boolean }
    Delivery:
      type: object
      required: [id, pipeline, runId, step, itemId, generation, state, attempt, costUsd, createdAt, waitMs, workMs]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        runId: { type: string }
        step: { type: string }
        itemId: { type: string }
        generation: { type: integer }
        state: { $ref: "#/components/schemas/DeliveryState" }
        attempt: { type: integer }
        leaseOwner: { type: string }
        leaseExpiresAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        errorClass: { type: string }
        errorMessage: { type: string }
        filterReason: { type: string }
        costUsd: { type: number }
        createdAt: { type: string, format: date-time }
        leasedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        waitMs: { type: integer }
        workMs: { type: integer }
        fallback: { type: boolean, description: The step's fallback action runs the delivery (spec section 11.5). }
        attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" }, description: On one delivery only. }
    Attempt:
      type: object
      required: [attempt, outcome, costUsd, workMs, artifacts]
      additionalProperties: false
      properties:
        attempt: { type: integer }
        owner: { type: string }
        leasedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [running, done, retry, dead, filtered, cancelled, leaseExpired, awaitingReview]
        errorClass: { type: string }
        error: { type: string }
        costUsd: { type: number }
        workMs: { type: integer }
        artifacts: { type: array, items: { $ref: "#/components/schemas/ArtifactRef" } }
    DeadLetterGroup:
      type: object
      required: [fingerprint, step, kind, error, count, firstSeen, lastSeen, deadLetters]
      additionalProperties: false
      properties:
        fingerprint: { type: string }
        step: { type: string }
        kind: { type: string, enum: [dead, unrouted] }
        error: { type: string, description: The error with what varies between occurrences replaced. }
        count: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        deadLetters: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } }
    DeadLetter:
      type: object
      required: [id, runId, originDelivery, stream, state, error, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        runId: { type: string }
        originDelivery: { type: string }
        stream: { type: string }
        state: { type: string, enum: [open, replayed, discarded] }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    DeadLetterSelection:
      type: object
      description: Exactly one of ids, fingerprint and all, among the pipeline's open dead letters.
      additionalProperties: false
      properties:
        ids: { type: array, items: { type: string } }
        fingerprint: { type: string }
        all: { type: boolean }
        migrate: { type: boolean, description: Replay only. Move each run to the active revision first. }
    Count:
      type: object
      required: [count]
      additionalProperties: false
      properties:
        count: { type: integer }
    RollbackRequest:
      type: object
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 0, description: "The revision to reactivate; 0 or absent: the one before the active one." }
    ApplyRequest:
      type: object
      required: [packages]
      additionalProperties: false
      properties:
        packages:
          type: array
          minItems: 1
          items:
            type: object
            required: [files]
            additionalProperties: false
            properties:
              files:
                type: object
                description: The package's files by slash-separated path, each base64.
                additionalProperties: { type: string, contentEncoding: base64 }
              proposals:
                type: array
                description: >-
                  The accepted proposals the package carries: the Millstream-Proposal trailers of the commit it comes
                  from. Each is recorded applied, validated in this combination or not.
                items: { type: string }
        force: { type: boolean, description: Let through breaking an importer's contract. }
        message: { type: string, description: Why, kept with each revision. }
    ApplyResponse:
      type: object
      required: [revisions, warnings]
      additionalProperties: false
      properties:
        revisions:
          type: array
          items:
            type: object
            required: [pipeline, revision, packageHash, created]
            additionalProperties: false
            properties:
              pipeline: { type: string }
              revision: { type: integer }
              packageHash: { type: string }
              created: { type: boolean, description: False when the package was the active one already. }
              tokens:
                type: array
                description: The new tokens of its webhook triggers that had none, shown this once.
                items: { $ref: "#/components/schemas/TriggerToken" }
        warnings:
          type: array
          items:
            type: object
            required: [pipeline, severity, path, message]
            additionalProperties: false
            properties:
              pipeline: { type: string }
              severity: { type: string }
              path: { type: string }
              message: { type: string }
    TriggerToken:
      type: object
      description: A webhook trigger's token, shown once.
      required: [trigger, token, path]
      additionalProperties: false
      properties:
        trigger: { type: string }
        token: { type: string }
        path: { type: string, description: "Where the trigger is served, under the server's address." }
    WebhookRun:
      type: object
      required: [pipeline, runId, created]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        runId: { type: string }
        created: { type: boolean, description: False when the request id had already fired the run. }
    TriggerRequest:
      type: object
      additionalProperties: false
      properties:
        trigger: { type: string, description: The pipeline's first manual trigger by default. }
        payload: { description: "The trigger item's payload; {} by default." }
        requestId: { type: string, description: Firing the same request id again returns the same run. }
    ProposalState: { type: string, enum: [drafting, validating, ready, accepted, rejected, stale] }
    ProposalKind: { type: string, enum: [config, prompt, lessons, topology, distill] }
    ProposalRequest:
      type: object
      required: [pipeline, kind, patch]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        kind: { $ref: "#/components/schemas/ProposalKind" }
        patch: { type: string, description: A unified diff of the package, as git diff writes it. }
        rationale: { type: string }
        insights: { type: array, items: { type: string }, description: The ids of the insights it answers. }
        fingerprint: { type: string, description: Names the idea; derived from the pipeline, kind, insights and paths when empty. }
    ProposalDecision:
      type: object
      additionalProperties: false
      properties:
        patchSha256: { type: string, description: Accepting, the hash of the patch the decider saw. }
        reason: { type: string, description: Rejecting, why; required. }
    Proposal:
      type: object
      required: [id, pipeline, kind, state, baseRevision, patch, patchSha256, paths, steps, rationale, insights,
        fingerprint, report, createdBy, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        kind: { $ref: "#/components/schemas/ProposalKind" }
        state: { $ref: "#/components/schemas/ProposalState" }
        baseRevision: { type: string, description: The package hash of the revision the patch applies to. }
        patch: { type: string }
        patchSha256: { type: string }
        paths: { type: array, items: { type: string }, description: The package paths the patch touches. }
        steps: { type: array, items: { type: string }, description: The steps the patch touches. }
        rationale: { type: string }
        insights: { type: array, items: { type: string } }
        fingerprint: { type: string }
        report:
          description: The latest validation report, null before the first.
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/ValidationReport" }
        createdBy: { type: string }
        decidedBy: { type: string }
        reason: { type: string, description: Why it was rejected. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    ValidationReport:
      type: object
      required: [passed, baseRevision, patchSha256]
      properties:
        passed: { type: boolean }
        baseRevision: { type: string }
        patchSha256: { type: string }
        error: { type: string, description: Why the validation could not run. }
        check:
          type: object
          required: [passed, diagnostics]
          properties:
            passed: { type: boolean }
            diagnostics:
              type: array
              items:
                type: object
                required: [severity, path, message]
                properties:
                  severity: { type: string, enum: [error, warning] }
                  path: { type: string }
                  message: { type: string }
        evals:
          type: array
          description: Each affected action on the base revision's cases, before and after.
          items: { $ref: "#/components/schemas/EvalReport" }
        newEvals:
          type: array
          description: The cases the patch adds or changes, after alone, reported apart.
          items: { $ref: "#/components/schemas/EvalReport" }
        backtest:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            skipped: { type: string, description: Why the backtest did not run (check failed, or the backtest was refused); it did not pass. }
            report: { description: "The backtest's report, as GET /backtests/{backtest} answers it." }
    EvalReport:
      type: object
      required: [step, action, passed, cases]
      properties:
        step: { type: string }
        action: { type: string }
        after: { type: string, description: The step's action after the patch, when it changes. }
        passed: { type: boolean }
        error: { type: string }
        cases:
          type: array
          items:
            type: object
            required: [case, after]
            properties:
              case: { type: string }
              before: { $ref: "#/components/schemas/EvalScore" }
              after: { $ref: "#/components/schemas/EvalScore" }
    EvalScore:
      type: object
      required: [passed, score]
      properties:
        passed: { type: boolean }
        score: { type: number }
        error: { type: string }
    PurgeRequest:
      type: object
      description: Exactly one of key and item.
      additionalProperties: false
      properties:
        key: { type: string, description: Every item with this key. }
        item: { type: string, description: The item with this id. }
        pipeline: { type: string, description: Only in this pipeline; every pipeline by default. Its copies in importing pipelines are followed all the same. }
        requestId: { type: string }
    Purge:
      type: object
      required: [id, scope, state, items, erased, pipelines, bundles, requestedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        scope: { type: string, enum: [key, item] }
        pipeline: { type: string, description: The pipeline the request named. }
        state: { type: string, enum: [erasing, sweeping, done] }
        items: { type: integer, description: The items fenced, descendants and copies included. }
        erased: { type: integer }
        pipelines: { type: array, items: { type: string } }
        bundles: { type: array, items: { type: string }, description: The evidence bundles exported holding a key it erased. }
        requestedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    EvidenceExportRequest:
      type: object
      additionalProperties: false
      properties:
        since: { type: string, description: Sample the deliveries created within this duration (30d by default). }
        insight: { type: string, description: Carry this insight alone and sample its step. }
    EvidenceImportRequest:
      type: object
      required: [bundle]
      additionalProperties: false
      properties:
        bundle: { type: string, format: byte, description: The bundle, base64. }
    EvidenceImport:
      type: object
      required: [id, pipeline, items, exportedAt, expiresAt, productionRevision, localRevision, diverged]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        items: { type: integer }
        exportedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        productionRevision: { type: string, description: The package hash of the revision the bundle was exported on. }
        localRevision: { type: string, description: The package hash of this deployment's active revision, empty when the pipeline is not applied. }
        diverged: { type: boolean, description: The two revisions differ. }
    BacktestRequest:
      type: object
      required: [pipeline, baseRevision, patch]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        baseRevision: { type: string, description: The package hash of the revision the patch applies to; a patch whose Millstream-Base trailer names another is refused. }
        patch: { type: string, description: The unified diff against the base revision's package files. }
        sample: { type: integer, minimum: 0, description: The past deliveries to sample; improve.backtest.sample (200) by default. }
        steps: { type: array, items: { type: string }, description: Steps replayed besides those the patch changes. }
        source: { type: string, enum: [local, evidence], description: Where the sample comes from; local history when it reaches the changed steps, else imported evidence, by default. }
    Backtest:
      type: object
      required: [id, pipeline, state, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        pipeline: { type: string }
        state: { type: string, enum: [running, done, failed] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { $ref: "#/components/schemas/Error/properties/error" }
        report: { $ref: "#/components/schemas/BacktestReport" }
    BacktestReport:
      type: object
      required: [pipeline, baseRevision, patchHash, patchedRevision, source, changedSteps, sampled, strata, runs, before, after, steps, costUsd, startedAt, finishedAt]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        baseRevision: { type: string }
        patchHash: { type: string, description: The hex SHA-256 of the patch. }
        patchedRevision: { type: string, description: The patched package's hash. }
        source: { type: string, enum: [local, evidence] }
        bundles: { type: array, items: { type: string }, description: The evidence bundles read. }
        changedSteps: { type: array, items: { type: string } }
        sampled: { type: integer }
        strata: { type: object, additionalProperties: { type: integer }, description: The sample by outcome (done, filtered, dead, approved, rejected, edited). }
        runs: { type: integer, description: The historical runs fired again. }
        before: { $ref: "#/components/schemas/BacktestMetrics" }
        after: { $ref: "#/components/schemas/BacktestMetrics" }
        steps:
          type: array
          items:
            type: object
            required: [step, before, after]
            additionalProperties: false
            properties:
              step: { type: string }
              before: { $ref: "#/components/schemas/BacktestMetrics" }
              after: { $ref: "#/components/schemas/BacktestMetrics" }
        divergence:
          type: array
          description: The revisions the sample was recorded on other than the base.
          items:
            type: object
            required: [packageHash, sampled]
            additionalProperties: false
            properties:
              packageHash: { type: string }
              sampled: { type: integer }
        warnings: { type: array, items: { type: string } }
        costUsd: { type: number, description: What both replays cost, charged to improve.budget.dayUsd. }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    BacktestMetrics:
      type: object
      required: [compared, agreed, agreement, newlyReached, noLongerReached, reviewed, reviewAgreed, reviewAgreement, approved, approvalsDropped, ran, failed, failureRate, costUsd, latencyMs]
      additionalProperties: false
      properties:
        compared: { type: integer, description: Deliveries with a historical counterpart (the same step and input item). }
        agreed: { type: integer, description: Those that ended alike, the same state and outputs. }
        agreement: { type: number, description: agreed / compared, 0 when none. }
        newlyReached: { type: integer, description: Deliveries without a historical counterpart, items the patch admits. }
        noLongerReached: { type: integer, description: Historical deliveries on the sampled lineages the replay never made. }
        reviewed: { type: integer, description: Decided reviews on the sampled lineages. }
        reviewAgreed: { type: integer, description: "Those the replay agrees with: approved still reaching the review, edited reaching it with the edited values, rejected no longer reaching it." }
        reviewAgreement: { type: number }
        approved: { type: integer, description: The approvals among the reviews. }
        approvalsDropped: { type: integer, description: The approved items the replay no longer brings to their review. }
        ran: { type: integer, description: Deliveries an action or builtin ran, not stubbed. }
        failed: { type: integer }
        failureRate: { type: number }
        costUsd: { type: number }
        latencyMs: { type: number, description: The mean latency (queue wait and work) of the deliveries that ran. }
    ReplayRequest:
      type: object
      description: Exactly one of step (a replay run of the step over past items) and stream (a back-fill of an imported stream from the producer's retained items).
      additionalProperties: false
      properties:
        step: { type: string }
        stream: { type: string, description: An imported stream of the pipeline to back-fill; run does not apply. }
        since: { type: string, description: Only the items published within this duration (7d, 12h). }
        run: { type: string, description: Only this run's items. }
        where: { type: string, description: Only the items for which this CEL expression holds. }
        revision: { type: integer, description: The revision to run on; the active one by default. }
        requestId: { type: string }
    MetricSeries:
      type: object
      required: [name, group, points]
      additionalProperties: false
      properties:
        name: { type: string }
        group: { type: string }
        points:
          type: array
          items:
            type: object
            required: [t, count, sum, min, max]
            additionalProperties: false
            properties:
              t: { type: string, format: date-time }
              count: { type: integer }
              sum: { type: number }
              min: { type: number }
              max: { type: number }
    Review:
      type: object
      required: [pipeline, deliveryId, runId, step, inbox, state, version, parkedAt, editable, reasons, display, item]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        deliveryId: { type: string }
        runId: { type: string }
        step: { type: string }
        inbox: { type: string }
        state: { $ref: "#/components/schemas/ReviewState" }
        version: { type: integer, description: Name it in a decision to refuse a review escalated since. }
        parkedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        editable: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: string } }
        display: { type: string }
        decision: { type: string, enum: [approve, reject] }
        reviewer: { type: string }
        reason: { type: string }
        text: { type: string }
        patch: { type: array, items: { type: object }, description: The edit as a JSON Patch. }
        decidedAt: { type: string, format: date-time }
        item: { $ref: "#/components/schemas/Item" }
    ReviewPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Review" } }
        next: { type: string }
    ReviewDecision:
      type: object
      required: [decision, version]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approve, reject] }
        version:
          type: integer
          minimum: 1
          description: >-
            The version of the review the reviewer saw: a review escalated since is a conflict. The same decision
            sent again by the same reviewer (a lost response) succeeds again and changes nothing.
        patch: { type: array, items: { type: object }, description: A JSON Patch within the editable pointers. }
        reason: { type: string, description: A reason code; required to reject when the step lists some. }
        text: { type: string }
    Sample:
      type: object
      required: [pipeline, deliveryId, runId, step, inbox, state, display, createdAt, item]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        deliveryId: { type: string }
        runId: { type: string }
        step: { type: string }
        inbox: { type: string }
        state: { $ref: "#/components/schemas/SampleState" }
        display: { type: string }
        createdAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        decision: { type: string, enum: [agree, disagree] }
        reviewer: { type: string }
        reason: { type: string }
        decidedAt: { type: string, format: date-time }
        item: { $ref: "#/components/schemas/Item" }
    SamplePage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Sample" } }
        next: { type: string }
    SampleDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [agree, disagree] }
        reason: { type: string }
    Insight:
      type: object
      required: [pipeline, id, kind, scope, severity, state, summary, windowStart, windowEnd, openedAt, updatedAt,
        evidence]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        id: { type: string }
        kind: { type: string }
        scope: { type: string, description: The step it concerns, or pipeline. }
        severity: { type: string, enum: [info, warning, error] }
        state: { $ref: "#/components/schemas/InsightState" }
        summary: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        evidence: { type: object }
        imported:
          type: string
          description: The evidence bundle an open insight of production was imported in (spec section 11.2), listed
            beside the deployment's own and read-only here.
    DistillTraining:
      type: object
      required: [pipeline, step, agent, source, holdoutFrom, pairs, holdout, training, lessons, withheldExamples]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        step: { type: string }
        agent: { type: string, description: The step's agent action, kept as the distilled action's fallback. }
        source: { type: string, enum: [local, evidence] }
        holdoutFrom: { type: string, format: date-time, description: The holdout is the entities first seen at or after it. }
        pairs: { type: integer, description: Every pair of the step. }
        holdout: { type: integer, description: The pairs of the holdout, never served. }
        training:
          type: array
          items:
            type: object
            required: [key, input, outputs]
            additionalProperties: false
            properties:
              key: { type: string }
              input: {}
              outputs:
                type: array
                items:
                  type: object
                  required: [payload]
                  additionalProperties: false
                  properties:
                    key: { type: string }
                    payload: {}
              edited: { type: boolean, description: A reviewer's edit is part of the truth. }
        lessons:
          type: object
          additionalProperties: false
          properties:
            rules: { $ref: "#/components/schemas/StepLessons/properties/rules" }
            examples: { $ref: "#/components/schemas/StepLessons/properties/examples" }
        withheldExamples: { type: integer, description: Lesson examples withheld as derived from a holdout item. }
    StepLessons:
      type: object
      required: [step, rules, examples]
      additionalProperties: false
      properties:
        step: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: { type: string }
              source: { type: string }
              added: { type: string }
        examples:
          type: array
          items:
            type: object
            required: [input, output]
            additionalProperties: false
            properties:
              input: {}
              output: {}
              why: { type: string }
              source: { type: string }
    Session:
      type: object
      required: [auth, environment]
      additionalProperties: false
      properties:
        auth: { type: boolean, description: Whether the server requires the token. }
        user: { type: string, description: Who the request's decisions are recorded under. }
        environment:
          type: string
          enum: [production, development]
          description: The deployment's environment (spec section 11.2), shown in the UI's header.
    SessionLogin:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string }
    Nodes:
      type: object
      required: [engine, engines, nodes]
      additionalProperties: false
      properties:
        engine:
          type: object
          description: The engine serving this response, the active one or a standby serving reads.
          required: [state, id, version, environment, notificationsFailed]
          additionalProperties: false
          properties:
            state: { type: string, enum: [active, standby] }
            id: { type: string }
            version: { type: string }
            environment:
              type: string
              enum: [production, development]
              description: >-
                The deployment's environment (spec section 11.2): production refuses the improve pipeline and
                improve.publish apply. serve defaults to production, run to development.
            since:
              type: string
              format: date-time
              description: When the engine took the leadership lock (active) or began to wait for it (standby).
            epoch:
              type: integer
              description: The active engine's leadership epoch, one more at each acquisition of the lock (Postgres).
            notificationsFailed:
              type: integer
              description: Review notifications that failed after their retries or were dropped since the engine started.
        engines:
          type: array
          description: >-
            The deployment's engines, the active one first, then the standbys in the order they began to wait (spec
            section 5.9). On SQLite, the serving engine alone.
          items: { $ref: "#/components/schemas/DeploymentEngine" }
        nodes:
          type: array
          description: The embedded node, then the remote nodes that registered or were revoked, by id.
          items: { $ref: "#/components/schemas/Node" }
        unschedulable:
          type: array
          description: >-
            The steps whose pending deliveries none of the registered nodes, active and heard from within a lease, can
            take: none offers the runtime the step's action needs or carries its placement labels (spec section 5.10).
            The active engine's view: a standby leaves it out.
          items:
            type: object
            required: [pipeline, step, pending, needs]
            additionalProperties: false
            properties:
              pipeline: { type: string }
              step: { type: string }
              pending: { type: integer }
              needs: { type: string, description: 'What a node must offer, such as "runtime exec, labels gpu=true".' }
    DeploymentEngine:
      type: object
      required: [id, state, version]
      additionalProperties: false
      properties:
        id: { type: string }
        state: { type: string, enum: [active, standby] }
        version: { type: string }
        since:
          type: string
          format: date-time
          description: When the engine took the leadership lock (active) or began to wait for it (standby).
        epoch: { type: integer, description: The active engine's leadership epoch. }
        address: { type: string, description: Where the active engine serves its API, when it serves one. }
    Node:
      type: object
      required: [id, embedded, version, behind, slots, leases, labels, runtimes, state, health]
      additionalProperties: false
      properties:
        id: { type: string }
        embedded: { type: boolean }
        version: { type: string }
        behind: { type: boolean, description: The node runs another version than the engine serving the response. }
        slots: { type: integer }
        leases: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        runtimes:
          type: array
          description: "The runtimes it offers (spec section 5.10): exec, container, and agent:<harness> per harness."
          items: { type: string }
        state: { type: string, enum: [active, draining, revoked] }
        health:
          type: string
          enum: [healthy, late, lost]
          description: >-
            From its last heartbeat: healthy within three heartbeat intervals, late within a lease, lost beyond (its
            leases expire). The embedded node is always healthy.
        lastHeartbeat: { type: string, format: date-time, description: A remote node's last registration or heartbeat. }
    Event:
      type: object
      description: The data of a "state" event.
      required: [seq, ts, pipeline, kind, data]
      additionalProperties: false
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        pipeline: { type: string }
        runId: { type: string }
        kind: { type: string }
        data: { type: object }
    PipelineSnapshot:
      type: object
      description: The data of a "snapshot" event.
      required: [pipeline, at, seq, paused, steps]
      additionalProperties: false
      properties:
        pipeline: { type: string }
        at: { type: string, format: date-time }
        seq: { type: integer, description: The last event the snapshot reflects. }
        paused: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [step, paused, queued, inFlight, awaitingReview, throughputPerMin, errorRate, p95LatencyMs]
            additionalProperties: false
            properties:
              step: { type: string }
              paused: { type: boolean }
              queued: { type: integer }
              inFlight: { type: integer }
