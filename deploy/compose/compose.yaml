# The VPS deployment of spec section 14: Postgres, two engines (one active, one hot standby) and two nodes.
#   cp .env.example .env    # then set every value
#   docker compose up -d
# docs/guides/deployment.md is the guide: TLS in front, backups, upgrades. The engines are configured by MILLSTREAM_* variables
# (spec section 14): settings below, secrets from .env, never from this file.
#
# The engines serve HTTPS with the certificate in ./tls (docs/guides/deployment.md, "Node TLS"), which the nodes check against
# ./tls/ca.pem: nodes reach an engine on another host over TLS only.

name: millstream

x-millstream: &millstream
  image: ${MILLSTREAM_IMAGE:-millstream:dev}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-engine: &engine
  <<: *millstream
  # serve runs the engine from its environment; the packages come from the store (millstream apply --server).
  command: ["serve"]
  environment:
    MILLSTREAM_ENVIRONMENT: production
    # Both engines share one Postgres database: the one holding its advisory lock is active, the other waits as the
    # standby. PGUSER and PGPASSWORD are libpq's, so the DSN carries no credentials.
    MILLSTREAM_STORE_DSN: postgres://postgres/millstream?sslmode=disable
    PGUSER: millstream
    PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    # A dead engine's lock is free, and a cut-off one steps down, within engine.lockCheck + 2 x engine.keepalive
    # (5s each by default; MILLSTREAM_ENGINE_LOCK_CHECK and MILLSTREAM_ENGINE_KEEPALIVE tune them, docs/guides/deployment.md).
    # The API listens on every interface of the container so compose can publish it, over HTTPS (HTTP/2) with the
    # certificate in ./tls, for the nodes and the reverse proxy alike. A non-loopback listener needs the token.
    MILLSTREAM_LISTEN: 0.0.0.0:7070
    MILLSTREAM_AUTH_TOKEN: ${MILLSTREAM_AUTH_TOKEN:?set MILLSTREAM_AUTH_TOKEN in .env}
    MILLSTREAM_TLS_CERT: /etc/millstream/tls/cert.pem
    MILLSTREAM_TLS_KEY: /etc/millstream/tls/key.pem
    # The work runs on the node containers, not inside the engines; nodes authenticate with the node token.
    MILLSTREAM_NODE_EMBEDDED: "false"
    MILLSTREAM_NODE_TOKEN: ${MILLSTREAM_NODE_TOKEN:?set MILLSTREAM_NODE_TOKEN in .env}
    MILLSTREAM_REGISTRIES: "{ lab: ghcr.io/monolithiclab/millstream-actions }"
    MILLSTREAM_RETENTION_EVENTS: 90d
    MILLSTREAM_RETENTION_TRANSCRIPTS: 30d
    MILLSTREAM_RETENTION_ROLLUPS: 400d
    # The address of the TLS reverse proxy in front (docs/guides/deployment.md).
    MILLSTREAM_UI_BASE_URL: ${MILLSTREAM_UI_BASE_URL:?set MILLSTREAM_UI_BASE_URL in .env}
    # Artifacts: without a URL the active engine keeps them in its working directory, the volume both engines share.
    # An S3-compatible bucket shared by both engines survives a failover too, and the nodes reach it through
    # presigned URLs; set the three values in .env. An empty variable is unset.
    MILLSTREAM_ARTIFACTS_URL: ${MILLSTREAM_ARTIFACTS_URL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    # A pipeline's secrets are MILLSTREAM_SECRET_<NAME> variables: add one here for each, taken from .env.
  # The root file system is read-only: the engines' working directory is a volume they share, so artifacts kept in
  # the local directory survive a failover.
  volumes:
    - ./tls:/etc/millstream/tls:ro
    - engine:/home/nonroot
  depends_on:
    postgres: { condition: service_healthy }

x-node: &node
  <<: *millstream
  # A node joins the engines with the node token over TLS, trusting ./tls/ca.pem, and follows the active one across a
  # failover. --allow-exec runs exec actions, which must be static Linux binaries in this image (docs/guides/deployment.md).
  command: ["node", "--join", "https://engine:7070,https://engine-standby:7070", "--allow-exec",
    "--ca", "/etc/millstream/tls/ca.pem"]
  environment:
    MILLSTREAM_NODE_TOKEN: ${MILLSTREAM_NODE_TOKEN:?set MILLSTREAM_NODE_TOKEN in .env}
  depends_on: [engine]

services:
  # postgres:17-trixie, pinned by digest (resolved 2026-10-16). Not published: only the engines reach it.
  postgres:
    image: postgres:17-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: millstream
      POSTGRES_DB: millstream
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millstream -d millstream"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The two engines are identical: whichever takes the store's advisory lock first is active, the other waits as the
  # standby and takes over when the active one fails. Each publishes its API, over HTTPS, on the host's loopback only.
  engine:
    <<: *engine
    ports: ["127.0.0.1:7070:7070"]

  engine-standby:
    <<: *engine
    ports: ["127.0.0.1:7071:7070"]

  # Each node's working directory, its package cache, is a volume of its own.
  node-1:
    <<: *node
    volumes: [./tls/ca.pem:/etc/millstream/tls/ca.pem:ro, node-1:/home/nonroot]

  node-2:
    <<: *node
    volumes: [./tls/ca.pem:/etc/millstream/tls/ca.pem:ro, node-2:/home/nonroot]

volumes:
  postgres:
  engine:
  node-1:
  node-2:
