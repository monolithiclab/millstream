# The environment file of the Compose deployment (spec section 14), mounted read-only at
# /etc/millstream/millstream.yaml in both engines. Secrets are never written here: each { env: NAME } reads the
# variable compose.yaml passes from .env.
#
# M4 status: the engine parses store, listen, auth, node and artifacts from Task 2 of the M4 plan (serve); until then
# millstream refuses them as not supported yet. Key shapes marked "Task N" may still change with that task.
environment: production

# Both engines share one Postgres database; the one holding its advisory lock is active, the other waits as the
# standby (Task 3).
store: { postgres: { dsn: { env: MILLSTREAM_DSN } } }

# Inside the container the API listens on every interface, so compose can publish it; a non-loopback listener is
# refused without auth.token. Publish it on the host's loopback and put a TLS reverse proxy in front (docs/deploy.md).
listen: 0.0.0.0:7070
auth: { token: { env: MILLSTREAM_TOKEN } }

# The work runs on the node containers, not inside the engines. Nodes authenticate with the node token over TLS
# (spec section 15.7); the engine certificate's keys arrive with Task 4.
node: { embedded: false, token: { env: MILLSTREAM_NODE_TOKEN } }

# Artifacts: an S3-compatible store shared by both engines, so a failover keeps them (Task 4). Uncomment and set the
# credentials in .env; without it the active engine keeps them in its working directory, the volume both engines
# share.
# artifacts: { s3: { bucket: millstream-artifacts, endpoint: https://s3.fr-par.scw.cloud } }

registries: { lab: ghcr.io/monolithiclab/millstream-actions }

# One block per pipeline: the secrets it resolves, each from a variable of .env passed in compose.yaml.
# secrets:
#   property-sourcing: { homesiteToken: { env: HOMESITE_TOKEN } }

retention: { events: 90d, transcripts: 30d, rollups: 400d }
lessons: { maxTokens: 2000 }
ui: { baseUrl: https://millstream.example }
