# The environment file of the Compose deployment (spec section 14), mounted read-only at
# /etc/millstream/millstream.yaml in both engines. Secrets are never written here: each { env: NAME } reads the
# variable compose.yaml passes from .env.
#
environment: production

# Both engines share one Postgres database; the one holding its advisory lock is active, the other waits as the
# standby, serving the UI read-only, and takes over when it fails.
store: { postgres: { dsn: { env: MILLSTREAM_DSN } } }
# How each engine watches its write connection: a dead engine's lock is free, and a cut-off one steps down, within
# lockCheck + 2 x keepalive (docs/deploy.md, Standby and failover).
engine: { lockCheck: 5s, keepalive: 5s }

# Inside the container the API listens on every interface, so compose can publish it; a non-loopback listener is
# refused without auth.token. Publish it on the host's loopback and put a TLS reverse proxy in front, at ui.baseUrl
# (docs/deploy.md). Every decision made through the API is recorded under auth.user (default operator).
listen: 0.0.0.0:7070
auth: { token: { env: MILLSTREAM_TOKEN } }

# The engines serve HTTPS (HTTP/2) with this certificate, for the nodes and the reverse proxy alike: ./tls, mounted
# at /etc/millstream/tls (docs/deploy.md, "Node TLS").
tls: { cert: tls/cert.pem, key: tls/key.pem }

# The work runs on the node containers, not inside the engines. Nodes authenticate with the node token over TLS
# (spec section 15.7).
node: { embedded: false, token: { env: MILLSTREAM_NODE_TOKEN } }

# Artifacts: an S3-compatible store shared by both engines, so a failover keeps them, which the nodes reach through
# presigned URLs. Uncomment and set the credentials in .env (AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY passed to
# the engines); without it the active engine keeps them in its working directory, the volume both engines share,
# and proxies them to the nodes.
# artifacts: { s3: { bucket: millstream-artifacts, endpoint: https://s3.fr-par.scw.cloud } }

registries: { lab: ghcr.io/monolithiclab/millstream-actions }

# One block per pipeline: the secrets it resolves, each from a variable of .env passed in compose.yaml.
# secrets:
#   property-sourcing: { homesiteToken: { env: HOMESITE_TOKEN } }

retention: { events: 90d, transcripts: 30d, rollups: 400d }
lessons: { maxTokens: 2000 }
ui: { baseUrl: https://millstream.example }
