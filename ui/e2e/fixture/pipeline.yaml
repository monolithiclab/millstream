# The package make test-ui-e2e runs: millstream run serves the API and the UI over it. Builtin steps only, so the
# Playwright container needs no action runtime.
pipeline: listings-daily
description: Listings shortlisted and reviewed
triggers:
  adhoc: { manual: {} }
steps:
  shortlist:
    action: filter
    in: trigger.adhoc
    out: listings.shortlist
    config: { expr: 'true' }
  # Dies (class expr, never retried) on a listing whose surface is 0, so the e2e run has a dead letter to replay;
  # every other payload passes.
  price-check:
    action: filter
    in: trigger.adhoc
    out: listings.priced
    config: { expr: '!has(item.priceEur) || item.priceEur / item.surfaceM2 > 0' }
  analyst-review:
    action: review
    in: listings.shortlist
    out: listings.reviewed
    config: { inbox: analysts, reasons: [overpriced, stale] }
