name: CI

# A `v*` tag runs release.yml, which calls this workflow (workflow_call) before it publishes.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push supersedes a pull request's run. Called from release.yml, github.workflow and github.event_name are the
# caller's (Release, push): that run has a group of its own and is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing at workflow scope; each job asks for what it reads.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: shellcheck --version
      # The whole gate, exactly as run locally.
      - run: make ci

  # The e2e-tagged suite: built binaries, real processes, Docker. Slow, so a job of its own. internal/e2e (the crash
  # matrix and the chaos suites) is the manual Scenarios workflow.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-e2e

  # The web UI: typecheck, lint, format and Vitest, in the node image pinned in ui/images.mk (D35).
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-ui

  # The built web UI under Playwright and axe, in the Playwright image pinned in ui/images.mk.
  ui-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go builds the binary the tests reach the UI through (millstream run).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-ui-e2e

  # The container image built from source (Dockerfile) and smoke-tested, and the deployment files checked: Compose
  # config and systemd-analyze. Nothing is pushed; the release job below checks the image a release ships.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test-image test-deploy

  # The GoReleaser snapshot (archives, SBOMs, checksums, Homebrew formula, one image per platform) and its amd64
  # image smoke-tested at the snapshot version, so a release tag only repeats what this job proved. Publishes nothing.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Dockerfile.release has no RUN, so the arm64 image needs no QEMU. The action and its buildkit image are pinned
      # by digest (read from the registry on 2026-10-07): a mutable tag would build every layer a release ships.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - run: make test-release
