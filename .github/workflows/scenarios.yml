name: Scenarios

# internal/e2e (make test-scenarios): the crash matrix, the failover and node chaos suites and the milestone
# scenarios. Too slow for every push, so CI leaves them out; run this by hand from time to time, and before a release:
#   gh workflow run scenarios.yml
on:
  workflow_dispatch:

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: make test-scenarios
