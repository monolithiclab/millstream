name: Release

# A v* tag: CI again (ci.yml, the snapshot included), then make release (GoReleaser: archives, SBOMs, signed
# SHA256SUMS, the signed GHCR image and the Homebrew formula), then the release checked as a user gets it, on fresh
# Linux and macOS runners. Tags are pushed only by hand, and only from main.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# Nothing at workflow scope: a token minted here is handed to every step of every job, third-party actions
# included. The one job that needs write scopes asks for them itself.
permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # GitHub Release create/upload
      packages: write       # ghcr.io push
      id-token: write       # cosign keyless via OIDC
    steps:
      # v0.1.0 failed *after* a 4-minute build: the tap token could authenticate but
      # lacked Contents:write on monolithiclab/homebrew-tap, so GoReleaser 403'd on the
      # very last step, leaving a published GitHub Release with no Homebrew formula.
      # Check the token up front so that misconfiguration costs seconds, not a re-tag.
      # Prerelease tags are only warned about, matching `skip_upload: auto` in
      # .goreleaser.yaml (which skips the brew step for prereleases anyway).
      - name: Preflight - verify Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: monolithiclab/homebrew-tap
        run: |
          set -uo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) severity=warning ;;   # prerelease: brew upload is skipped
            *)   severity=error   ;;
          esac
          fail() {
            echo "::${severity}::$1"
            [ "$severity" = error ] && exit 1 || exit 0
          }

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            fail "HOMEBREW_TAP_TOKEN is not set. Add a fine-grained PAT with 'Contents: Read and write' on ${TAP} to this repository's Actions secrets."
          fi

          response=$(curl -sS -o /tmp/tap.json -w '%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TAP}") || fail "Could not reach the GitHub API to validate HOMEBREW_TAP_TOKEN."

          case "$response" in
            200) ;;
            401) fail "HOMEBREW_TAP_TOKEN is invalid or expired (401). Mint a new fine-grained PAT with 'Contents: Read and write' on ${TAP}." ;;
            404) fail "HOMEBREW_TAP_TOKEN cannot see ${TAP} (404). A fine-grained PAT must list ${TAP} under 'Repository access'." ;;
            *)   fail "Unexpected HTTP ${response} validating HOMEBREW_TAP_TOKEN against ${TAP}." ;;
          esac

          if [ "$(jq -r '.permissions.push // false' /tmp/tap.json)" != "true" ]; then
            fail "HOMEBREW_TAP_TOKEN can read ${TAP} but cannot push to it. Grant 'Contents: Read and write' - read-only is what made the v0.1.0 release 403."
          fi
          echo "HOMEBREW_TAP_TOKEN verified: push access to ${TAP} confirmed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs full history for changelog
          # GoReleaser authenticates with GITHUB_TOKEN from env, so the token need not stay in .git/config.
          persist-credentials: false
      - name: Refuse a tag that isn't on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Dockerfile.release has no RUN, so the arm64 image needs no QEMU. The action and its buildkit image are pinned
      # by digest (read from the registry on 2026-10-07): a mutable tag would build every layer a release ships, inside
      # the job holding all three write scopes.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Installs cosign v3, whose sign-blob requires --bundle; .goreleaser.yaml's
      # signs: block writes SHA256SUMS.sigstore.json accordingly.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # GoReleaser and syft come from tools/release/go.mod (make release-tools), not goreleaser-action or
      # download-syft: what builds and signs a release changes only with a commit.
      - run: make release
        env:
          # GoReleaser otherwise picks the tag from `git tag --points-at HEAD`, and git's
          # version sort ranks v0.1.3-rc1 above v0.1.3. With both on one commit, the v0.1.3
          # push re-released the rc (and re-signed its checksums under the v0.1.3 identity,
          # which install.sh then rejected for the rc). Pin it to the tag that triggered us.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The release as a user gets it, on runners that built nothing: the signature over SHA256SUMS, install.sh with
  # cosign required, a scaffolded action built against the published Go SDK, and, on Linux, the signed image; on
  # macOS, the Homebrew formula (not published for a prerelease).
  verify:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read        # checkout, gh release download
      packages: read        # ghcr.io pull
    env:
      IDENTITY: https://github.com/monolithiclab/millstream/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
      ISSUER: https://token.actions.githubusercontent.com
      IMAGE: ghcr.io/monolithiclab/millstream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not cached: the scaffolded action must fetch the SDK from the module proxy, as a user's build does.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Version and prerelease
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac
      - name: Verify the signature over SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sums"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D "$dir" \
            -p SHA256SUMS -p SHA256SUMS.sigstore.json
          cosign verify-blob --bundle "$dir/SHA256SUMS.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$dir/SHA256SUMS"
      - name: Install with install.sh, cosign required
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          MILLSTREAM_VERSION="${GITHUB_REF_NAME}" MILLSTREAM_INSTALL_DIR="$bin" MILLSTREAM_REQUIRE_COSIGN=1 \
            sh scripts/install.sh
          got=$("$bin/millstream" version)
          [ "$got" = "millstream ${VERSION}" ] || { echo "::error::millstream version printed '$got', want 'millstream ${VERSION}'"; exit 1; }
          echo "$bin" >> "$GITHUB_PATH"
      # Outside any checkout, so the SDK comes from the module proxy at the version the scaffold requires.
      - name: Scaffold an action and build it against the published SDK
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/action"
          mkdir -p "$dir"
          cd "$dir"
          millstream init action greet
          cd greet
          go mod tidy
          go build ./...

      - name: Log in to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the image signature
        if: runner.os == 'Linux'
        run: |
          cosign verify "$IMAGE:$VERSION" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" >/dev/null
      - name: Smoke-test the image
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          node_image=$(sed -n 's/^UI_NODE_IMAGE = //p' ui/images.mk)
          [ -n "$node_image" ] || { echo "::error::no UI_NODE_IMAGE in ui/images.mk"; exit 1; }
          scripts/test-image "$IMAGE:$VERSION" "$node_image" "$VERSION"
      # GoReleaser tags latest for a release only; a prerelease must leave it where it was (or absent).
      - name: A prerelease does not move latest
        if: runner.os == 'Linux' && env.PRERELEASE == 'true'
        run: |
          set -euo pipefail
          tagged=$(docker manifest inspect "$IMAGE:$VERSION")
          if latest=$(docker manifest inspect "$IMAGE:latest" 2>/dev/null) && [ "$latest" = "$tagged" ]; then
            echo "::error::$IMAGE:latest names the prerelease $VERSION"
            exit 1
          fi

      - name: Install with Homebrew
        if: runner.os == 'macOS' && env.PRERELEASE == 'false'
        run: |
          set -euo pipefail
          brew install monolithiclab/tap/millstream
          got=$("$(brew --prefix)/bin/millstream" version)
          [ "$got" = "millstream ${VERSION}" ] || { echo "::error::brew's millstream version printed '$got', want 'millstream ${VERSION}'"; exit 1; }
