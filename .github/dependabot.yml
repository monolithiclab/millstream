version: 2

# Minor and patch bumps land as one PR per ecosystem; only majors get individual review.
updates:
  # The engine, the Go SDK and the two tools modules (linters; GoReleaser and syft).
  - package-ecosystem: gomod
    directories: ["/", "/sdk/go", "/tools", "/tools/release"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # "chore(...)" rather than "ci(...)": .goreleaser.yaml's changelog excludes
    # ^chore but not ^ci, so a ci-prefixed bump would surface in release notes.
    commit-message:
      prefix: "chore(ci-deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dockerfile and Dockerfile.release, every FROM pinned by digest; base-image CVEs are the main reason to rebuild
  # between releases. The UI toolchain images in ui/images.mk are bumped by hand.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
